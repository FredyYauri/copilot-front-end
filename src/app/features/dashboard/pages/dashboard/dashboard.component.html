<div class="dashboard">
  <h1 class="dashboard__title">Dashboard</h1>
  <p class="dashboard__welcome">
    @if (authService.user(); as user) {
      Bienvenido, {{ user.firstName }}
    } @else {
      Bienvenido al CRM
    }
  </p>

  <div class="dashboard__grid">
    <div class="dashboard__card">
      <h3 class="dashboard__card-title">Clientes</h3>
      <p class="dashboard__card-value">0</p>
      <p class="dashboard__card-label">Total registrados</p>
    </div>
    <div class="dashboard__card">
      <h3 class="dashboard__card-title">Oportunidades</h3>
      <p class="dashboard__card-value">0</p>
      <p class="dashboard__card-label">En seguimiento</p>
    </div>
    <div class="dashboard__card">
      <h3 class="dashboard__card-title">Tareas</h3>
      <p class="dashboard__card-value">0</p>
      <p class="dashboard__card-label">Pendientes</p>
    </div>
    <div class="dashboard__card">
      <h3 class="dashboard__card-title">Ventas</h3>
      <p class="dashboard__card-value">$0</p>
      <p class="dashboard__card-label">Este mes</p>
    </div>
  </div>
</div>
