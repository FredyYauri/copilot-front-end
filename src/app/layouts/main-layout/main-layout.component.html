<div class="main-layout">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <h2 class="sidebar__logo">CRM</h2>
    </div>
    <nav class="sidebar__nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="sidebar__link">
        <span class="sidebar__icon">📊</span>
        Dashboard
      </a>
      @if (authService.user()?.role === 'Administrador') {
        <a routerLink="/settings" routerLinkActive="active" class="sidebar__link">
          <span class="sidebar__icon">⚙️</span>
          Configuración
        </a>
      }
    </nav>
    <div class="sidebar__footer">
      <button class="sidebar__logout" (click)="onLogout()">
        Cerrar sesión
      </button>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="topbar__left">
        <h2 class="topbar__title">CRM App</h2>
      </div>
      <div class="topbar__right">
        @if (authService.user(); as user) {
          <span class="topbar__user">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="topbar__role">{{ user.role }}</span>
        }
      </div>
    </header>
    <div class="main-content__body">
      <router-outlet />
    </div>
  </main>
</div>
